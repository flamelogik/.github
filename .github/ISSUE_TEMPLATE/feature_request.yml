name: 💡 Feature request
description: Suggest an improvement to this tool
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your Flame work where this would help.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've tried
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd be willing to work on this with some guidance
        - label: I can test it on my setup
